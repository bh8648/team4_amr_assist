# oakd_detector_node용 커스텀 BoT-SORT 설정. 설치된 Ultralytics가 공식 지원하는
# tracker_type을 사용하면서 장시간 가림과 재등장에 맞게 아래 값을 조정했다:
#   - with_reid: True        -> 외형(appearance) 특징으로 재등장 매칭 활성화
#   - track_buffer: 30 -> 180 -> lost-track 유지 시간은 프레임 수 기준(초 단위 아님).
#     my_new_bag3 실측 처리율 약 9.75Hz 기준 180프레임 ≈ 18초. 이번 세션에 실측한 재등장
#     공백(약 9~11초)을 확실히 덮도록 여유를 뒀다. 30(≈3초)로는 공백을 못 덮어 with_reid를
#     켜도 애초에 lost 목록에서 이미 밀려나 효과가 없다.
#   - 작업자가 한 명인 운영 조건에서 순간 자세 변화/가림으로 ID를 놓치지 않도록 confidence와
#     association 기준을 완화했다. 저신뢰 검출은 새 트랙을 만들기보다 기존 트랙 유지에만 쓰고,
#     새 트랙은 0.5 이상의 검출에서만 시작한다.
#
# ReID의 model은 auto(포즈 모델 백본 특징 재사용, 별도 모델 다운로드 없음)로 남겨뒀다 -
# 먼저 추가 비용 없이 효과를 확인하고, 부족하면 이후 세션에서 명시적 ReID 모델로 올린다.

tracker_type: botsort
track_high_thresh: 0.4
track_low_thresh: 0.1
new_track_thresh: 0.5
track_buffer: 180
match_thresh: 0.85
fuse_score: True

# Camera motion compensation - OAK-D가 이동형 로봇에 장착돼 있으므로 유지
gmc_method: sparseOptFlow

# ReID
with_reid: True
model: auto
proximity_thresh: 0.3
appearance_thresh: 0.7
