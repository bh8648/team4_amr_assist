# oakd_detector_node용 커스텀 TrackTrack 설정. 설치된 ultralytics 8.4.115의 기본
# tracktrack.yaml에서 아래 3개 값만 바꿨다 (2026-08-08, amr_person_tracking 세션):
#   - with_reid: True        -> 외형(appearance) 특징으로 재등장 매칭 활성화
#   - track_buffer: 30 -> 180 -> lost-track 유지 시간은 프레임 수 기준(초 단위 아님).
#     my_new_bag3 실측 처리율 약 9.75Hz 기준 180프레임 ≈ 18초. 이번 세션에 실측한 재등장
#     공백(약 9~11초)을 확실히 덮도록 여유를 뒀다. 30(≈3초)로는 공백을 못 덮어 with_reid를
#     켜도 애초에 lost 목록에서 이미 밀려나 효과가 없다.
#   - lost_match_thr: 0.0 -> 0.9 -> lost 목록 대상 완화 재매칭 패스를 활성화(0.0=비활성).
#     match_thresh(0.7)보다 높게 설정하라는 원본 주석 권고를 따름.
#
# ReID의 model은 auto(포즈 모델 백본 특징 재사용, 별도 모델 다운로드 없음)로 남겨뒀다 -
# 먼저 추가 비용 없이 효과를 확인하고, 부족하면 이후 세션에서 명시적 ReID 모델로 올린다.

tracker_type: tracktrack
track_high_thresh: 0.6
track_low_thresh: 0.25
new_track_thresh: 0.7
track_buffer: 180
match_thresh: 0.7
lost_match_thr: 0.9

# Association weights
iou_weight: 0.5
reid_weight: 0.5
conf_weight: 0.1
angle_weight: 0.05

# Iterative assignment
penalty_p: 0.2
penalty_q: 0.4
reduce_step: 0.05

# Track-Aware Initialization (TAI)
tai_thr: 0.55
min_track_len: 3

# Camera motion compensation - OAK-D가 이동형 로봇에 장착돼 있으므로 유지
gmc_method: sparseOptFlow

# ReID
with_reid: True
model: auto
